[package]
name = "syno-perm-manager"
version = "1.0.0"
description = "Gestor de permisos ACL para Synology NAS via SSH"
authors = ["httpbnry"]
edition = "2021"

[lib]
name = "syno_perm_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "async-trait"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
dirs = "5"

